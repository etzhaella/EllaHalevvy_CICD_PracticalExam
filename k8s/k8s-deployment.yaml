apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-aws-monitor
  labels:
    app: flask-aws-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-aws-monitor
  template:
    metadata:
      labels:
        app: flask-aws-monitor
    spec:
      containers:
        - name: flask-aws-monitor
          image: your-dockerhub-username/flask-aws-monitor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
